<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - T-Flow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="{{ url_for('static', filename='img/t-flow.png') }}" alt="Logo T-Flow">
        </div>
        <form action="{{ url_for('login_page') }}" method="post">
            <div class="form-group">
                <input type="text" id="username" name="username" placeholder="Digite o seu usuário..." required>
            </div>
            <div class="form-group">
                <input type="password" id="password" name="password" placeholder="Digite o sua senha..." required>
            </div>
            <button type="submit" class="btn-entrar">ENTRAR</button>
        </form>
    </div>
</body>
</html>
